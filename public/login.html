<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CartMartBD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=20260515" rel="stylesheet">
</head>
<body data-auth-mode="login">
  <main class="section-wrap d-flex align-items-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="auth-card p-4 p-lg-5">
            <a href="/" class="text-decoration-none text-soft small">Back to home</a>
            <h1 id="authTitle" class="mt-3 mb-2">Welcome back</h1>
            <p class="text-soft mb-4">Log in to shop, place orders, or manage the store if you are an admin.</p>
            <div id="authAlert" class="alert alert-danger d-none"></div>
            <form id="authForm" method="post" action="/login.html" class="d-grid gap-3">
              <div>
                <label class="form-label">Email</label>
                <input class="form-control" type="email" name="email" placeholder="you@example.com" required>
              </div>
              <div>
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" placeholder="Your password" required>
              </div>
              <button id="authButton" class="btn btn-accent btn-lg" type="submit">Login</button>
            </form>
            <p class="text-soft mt-4 mb-0">No account yet? <a href="/register.html">Create one</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js?v=20260515"></script>
  <script src="/js/auth.js?v=20260515"></script>
</body>
</html>
