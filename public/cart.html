<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | CartMartBD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=20260515" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container py-2">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <span class="brand-mark">C</span>
        CartMartBD
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/cart.html">Cart <span class="badge text-bg-info ms-1" data-cart-count>0</span></a></li>
          <li class="nav-item"><a class="nav-link d-none" data-auth-state="user" href="/orders.html">My Orders</a></li>
          <li class="nav-item"><a class="nav-link d-none" data-auth-state="admin" href="/admin.html">Admin</a></li>
          <li class="nav-item"><a class="nav-link d-none" data-auth-state="guest" href="/login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link d-none" data-auth-state="guest" href="/register.html">Register</a></li>
          <li class="nav-item"><span class="nav-link text-soft small d-none d-lg-inline" data-user-label></span></li>
          <li class="nav-item"><button class="btn btn-sm btn-outline-light d-none" data-auth-state="user" data-logout>Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="section-wrap">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-8">
          <h1 class="section-title mb-3">Your Cart</h1>
          <div id="cartList"></div>
        </div>
        <div class="col-lg-4">
          <div id="cartSummary" class="mb-4"></div>
          <div class="glass-card p-4">
            <h2 class="h5 mb-3">Checkout details</h2>
            <div id="checkoutAlert" class="alert d-none"></div>
            <form id="checkoutForm" class="d-grid gap-3">
              <div>
                <label class="form-label">Full name</label>
                <input class="form-control" type="text" name="shippingName" required>
              </div>
              <div>
                <label class="form-label">Phone</label>
                <input class="form-control" type="text" name="shippingPhone" required>
              </div>
              <div>
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="3" name="shippingAddress" required></textarea>
              </div>
              <div>
                <label class="form-label">Payment method</label>
                <select class="form-select" name="paymentMethod">
                  <option>Cash on delivery</option>
                  <option>Mobile banking</option>
                </select>
              </div>
              <button class="btn btn-accent btn-lg" type="submit">Place order</button>
            </form>
            <p class="text-soft small mt-3 mb-0">You must be logged in to place an order.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=20260515"></script>
  <script src="/js/cart.js?v=20260515"></script>
</body>
</html>
