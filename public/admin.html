<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | CartMartBD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=20260515" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container py-2">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <span class="brand-mark">C</span>
        CartMartBD
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/cart.html">Cart <span class="badge text-bg-info ms-1" data-cart-count>0</span></a></li>
          <li class="nav-item"><a class="nav-link d-none" data-auth-state="user" href="/orders.html">My Orders</a></li>
          <li class="nav-item"><a class="nav-link d-none" data-auth-state="admin" href="/admin.html">Admin</a></li>
          <li class="nav-item"><a class="nav-link d-none" data-auth-state="guest" href="/login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link d-none" data-auth-state="guest" href="/register.html">Register</a></li>
          <li class="nav-item"><span class="nav-link text-soft small d-none d-lg-inline" data-user-label></span></li>
          <li class="nav-item"><button class="btn btn-sm btn-outline-light d-none" data-auth-state="user" data-logout>Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="section-wrap">
    <div class="container">
      <div class="d-flex justify-content-between flex-wrap gap-2 mb-4">
        <div>
          <h1 class="section-title mb-2">Admin Dashboard</h1>
          <p class="text-soft mb-0">Manage products and orders from one place.</p>
        </div>
      </div>

      <div id="adminStats" class="row g-3 mb-4"></div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="admin-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 id="productFormTitle" class="h5 mb-0">Add product</h2>
              <button id="resetProductButton" type="button" class="btn btn-sm btn-outline-light">Reset</button>
            </div>
            <form id="productForm" class="d-grid gap-3">
              <input type="hidden" id="productId" name="productId">
              <div>
                <label class="form-label">Name</label>
                <input class="form-control" name="name" required>
              </div>
              <div>
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3" required></textarea>
              </div>
              <div>
                <label class="form-label">Category</label>
                <input class="form-control" name="category" required>
              </div>
              <div>
                <label class="form-label">Image URL</label>
                <input class="form-control" name="imageUrl" required>
              </div>
              <div class="row g-3">
                <div class="col-6">
                  <label class="form-label">Price</label>
                  <input class="form-control" type="number" step="0.01" name="price" required>
                </div>
                <div class="col-6">
                  <label class="form-label">Stock</label>
                  <input class="form-control" type="number" name="stock" value="1" min="0" required>
                </div>
              </div>
              <button id="productSubmit" class="btn btn-accent" type="submit">Save product</button>
            </form>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="admin-card p-4 mb-4">
            <h2 class="h5 mb-3">Products</h2>
            <div id="productsTable"></div>
          </div>
          <div class="admin-card p-4">
            <h2 class="h5 mb-3">Orders</h2>
            <div id="ordersTable"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=20260515"></script>
  <script src="/js/admin.js?v=20260515"></script>
</body>
</html>
